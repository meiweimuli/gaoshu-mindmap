<head>

<title>考研数学 · 思维导图</title>
<style>
  :root { --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
         color:var(--fg); background:#f7f8fa; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; padding:40px 20px; }
  h1 { font-size:26px; margin:0 0 6px; font-weight:700; }
  p.sub { color:var(--muted); margin:0 0 34px; font-size:14px; }
  .grid { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
  a.card { display:block; width:300px; padding:22px 24px; background:#fff; border:1px solid var(--line);
           border-radius:14px; text-decoration:none; color:inherit; transition:.15s ease; }
  a.card:hover { border-color:var(--accent); box-shadow:0 6px 22px rgba(37,99,235,.12); transform:translateY(-2px); }
  .card h2 { margin:0 0 8px; font-size:19px; }
  .card p { margin:0; color:var(--muted); font-size:13px; line-height:1.6; }
  .tag { display:inline-block; margin-top:14px; font-size:12px; color:var(--accent); font-weight:600; }
</style>
</head>
<body>
  <h1>考研数学 · 思维导图</h1>

    </a>
  </div>
</body>
</html>
